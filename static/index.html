<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Todo App (Demo)</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    .done { text-decoration: line-through; color: #888; }
    .todo { display:flex; justify-content:space-between; padding: 4px 0; }
    .btn { cursor:pointer; }
  </style>
</head>
<body>
  <h1>Todo App (Demo)</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Add todo..." />
    <button>Add</button>
  </form>
  <ul id="todo-list"></ul>
  <script src="main.js"></script>
</body>
</html>
